<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Math Slot Machine — Settings Gear</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg:#0b1321; --panel:#111a2e; --accent:#ffd54a; --text:#e9f1ff; --muted:#9fb0d0;
      --good:#35d07f; --bad:#ff6b6b; --overlay: rgba(6,10,20,.65);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100svh; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(1200px 600px at 50% 20%, #152443, var(--bg));
      color:var(--text); font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }
    .cabinet{ width:min(960px, 94vw); background:linear-gradient(#132446,#0f1b36);
      border:2px solid #2a3a63; border-radius:20px; box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 0 40px rgba(255,255,255,.03);
      padding:22px 22px 26px;
    }
    .header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px }
    .title{ font-weight:800; letter-spacing:.5px; color:var(--accent); text-shadow:0 2px 0 #5a4700; margin:0 }

    .gear-btn{
      appearance:none; border:none; cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
      width:42px; height:42px; border-radius:10px; background:#14254a; border:1px solid #263a6d; color:#dbe6ff;
      box-shadow:0 6px 20px rgba(0,0,0,.3);
    }
    .gear-btn svg{ width:22px; height:22px; }

    .window{
      display:grid; grid-template-columns:1fr auto 1fr; gap:14px;
      background:var(--panel); border-radius:16px; padding:18px; border:1px solid #23345c;
      box-shadow:inset 0 0 0 4px #0c1530, inset 0 0 25px rgba(0,0,0,.5);
    }
    .reel{ height:120px; border-radius:12px; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(#0e1936,#0a1227); border:1px solid #22335b; font-size:76px; font-weight:900; line-height:1;
      position:relative; overflow:hidden; text-shadow:0 3px 0 rgba(0,0,0,.3);
    }
    .reel.sign{ width:110px; }
    .reel::after{ content:""; position:absolute; inset:0; box-shadow: inset 0 18px 18px rgba(255,255,255,.06), inset 0 -18px 18px rgba(0,0,0,.35); pointer-events:none; }
    .reel span{ display:block; transform:translateZ(0) }

    .controls{ margin-top:14px; display:flex; gap:16px; align-items:center; justify-content:space-between; flex-wrap:wrap; }

    .lever-wrap{ display:flex; align-items:center; gap:14px; }
    .lever-base{ width:18px; height:74px; background:#2a3a63; border-radius:9px; position:relative; box-shadow:inset 0 -6px 0 rgba(0,0,0,.35); }
    .lever{ position:absolute; left:50%; bottom:4px; transform-origin:bottom center; width:8px; height:58px; background:#a8b6dc; border-radius:5px;
      transform:translateX(-50%) rotate(0deg); transition:transform .15s ease; }
    .knob{ position:absolute; top:-18px; left:50%; transform:translateX(-50%); width:28px; height:28px; background:var(--accent); border-radius:50%;
      box-shadow:0 2px 0 #5a4700, 0 0 18px rgba(255,213,74,.35); border:2px solid #6b5600; }
    .lever.is-pulled{ transform:translateX(-50%) rotate(28deg) }

    button#pull{ appearance:none; border:none; cursor:pointer; background:linear-gradient(#ffd54a,#ffb300); color:#2a1d00; font-weight:800;
      padding:14px 18px; border-radius:10px; box-shadow:0 6px 0 #a67c00, 0 14px 24px rgba(0,0,0,.35); font-size:16px; letter-spacing:.3px; }
    button#pull:disabled{ opacity:.6; cursor:not-allowed; }

    .readout{ font-size:18px; color:var(--muted); flex:1; text-align:right; }
    .result{ font-weight:800; color:#b7c9ff; }

    .answer-row{ margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .answer-row input{ width:160px; padding:12px 14px; border-radius:10px; border:1px solid #2a3a63; background:#0e1a33; color:var(--text); font-weight:700; font-size:18px; }
    .answer-row input:disabled{ opacity:.6 }
    .answer-row button{ padding:12px 16px; border-radius:10px; border:1px solid #2a3a63; background:#1a2a4f; color:#dbe6ff; font-weight:800; cursor:pointer; }
    .answer-row button:disabled{ opacity:.6; cursor:not-allowed; }
    .badge{ font-weight:900; padding:6px 10px; border-radius:999px; }
    .ok{ background:rgba(53,208,127,.15); border:1px solid rgba(53,208,127,.5); color:var(--good); }
    .no{ background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.5); color:var(--bad); }

    /* Settings modal */
    .modal-overlay{ position:fixed; inset:0; background:var(--overlay); display:none; align-items:center; justify-content:center; padding:20px; }
    .modal-overlay.open{ display:flex; }
    .modal{ width:min(680px, 96vw); background:#0e1a33; color:var(--text); border:1px solid #2a3a63; border-radius:16px; box-shadow:0 24px 60px rgba(0,0,0,.45);
      padding:18px; }
    .modal h2{ margin:0 0 12px 0; font-size:20px; }
    .grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .field{ display:flex; flex-direction:column; gap:6px; }
    .field label{ font-size:13px; color:#b9c7ea; }
    .field input[type="number"]{ padding:10px 12px; border-radius:10px; border:1px solid #2a3a63; background:#0b1630; color:var(--text); font-weight:700; }
    .row{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin:6px 0 10px }
    .checkbox{ display:flex; align-items:center; gap:8px; }
    .modal .actions{ display:flex; justify-content:space-between; align-items:center; margin-top:12px }
    .btn{ padding:10px 14px; border-radius:10px; border:1px solid #2a3a63; background:#1a2a4f; color:#dbe6ff; font-weight:800; cursor:pointer; }
    .btn.primary{ background:linear-gradient(#ffd54a,#ffb300); color:#2a1d00; border-color:#6b5600 }
    .hint{ font-size:12px; color:#9fb0d0 }

    @media (max-width:560px){
      .reel{ height:96px; font-size:60px } .reel.sign{ width:92px }
      .readout{ width:100%; text-align:center; margin-top:8px } .controls{ justify-content:center }
      .answer-row input{ width:130px }
      .grid{ grid-template-columns:1fr }
    }
  </style>
</head>
<body>
  <div class="cabinet" role="application" aria-label="Math slot machine">
    <div class="header">
      <h1 class="title">Math Slot Machine</h1>
      <button id="gear" class="gear-btn" aria-label="Open settings">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M19.14 12.94a7.952 7.952 0 0 0 .06-.94c0-.32-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.028 7.028 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.23-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.65 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.51.41 1.05.71 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.58-.23 1.12-.53 1.63-.94l2.39.96c.21.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2Z"/>
        </svg>
      </button>
    </div>

    <div class="window" aria-live="polite">
      <div class="reel" id="left"  aria-label="left number"><span>0</span></div>
      <div class="reel sign" id="sign" aria-label="plus or minus"><span>+</span></div>
      <div class="reel" id="right" aria-label="right number"><span>0</span></div>
    </div>

    <div class="controls">
      <div class="lever-wrap">
        <div class="lever-base" aria-hidden="true">
          <div class="lever" id="lever"><div class="knob"></div></div>
        </div>
        <button id="pull" aria-label="Pull the lever (spacebar works too)">Pull Lever</button>
      </div>
      <div class="readout" id="readout">
        Target range: <code id="rangeLabel">0–9</code> • Press <kbd>Space</kbd>
      </div>
    </div>

    <form class="answer-row" id="answerForm" autocomplete="off">
      <label for="answer" class="visually-hidden" style="position:absolute;left:-9999px;">Your answer</label>
      <input id="answer" inputmode="numeric" pattern="[0-9\-]*" placeholder="Type answer…" disabled />
      <button id="check" type="submit" disabled>Check</button>
      <span id="feedback" aria-live="polite"></span>
    </form>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal">
      <h2 id="settingsTitle">Settings</h2>
      <div class="grid">
        <div class="field"><label for="min">Min value</label><input id="min" type="number" step="1" /></div>
        <div class="field"><label for="max">Max value</label><input id="max" type="number" step="1" /></div>
        <div class="field"><label for="base">Base rounds</label><input id="base" type="number" step="1" min="0" /></div>
        <div class="field"><label for="var">Variance rounds</label><input id="var" type="number" step="1" min="0" /></div>
        <div class="field"><label for="durL">Left duration (ms)</label><input id="durL" type="number" step="50" min="100" /></div>
        <div class="field"><label for="durS">Sign duration (ms)</label><input id="durS" type="number" step="50" min="100" /></div>
        <div class="field"><label for="durR">Right duration (ms)</label><input id="durR" type="number" step="50" min="100" /></div>
      </div>
      <div class="row">
        <label class="checkbox"><input id="tick" type="checkbox"/> Tick sound</label>
        <label class="checkbox"><input id="nonneg" type="checkbox"/> No negative results</label>
        <span class="hint">(swaps numbers if subtraction would go below 0)</span>
      </div>
      <div class="row">
        <span>Allowed signs:</span>
        <label class="checkbox"><input id="plus" type="checkbox"/> +</label>
        <label class="checkbox"><input id="minus" type="checkbox"/> −</label>
      </div>
      <div class="actions">
        <button type="button" id="reset" class="btn">Reset to defaults</button>
        <div style="display:flex; gap:10px">
          <button type="button" id="close" class="btn">Cancel</button>
          <button type="button" id="save" class="btn primary">Save & Close</button>
        </div>
      </div>
    </div>
  </div>

  <script>
  // ===== SETTINGS (persisted) =====
  const DEFAULTS = {
    min: 0,
    max: 9,
    baseRounds: 12,
    varianceRounds: 8,
    durLeft: 1600,
    durSign: 1900,
    durRight: 2200,
    tick: false,
    nonNegative: false,
    signs: ['+','−']
  };
  const LS_KEY = 'math-slot-settings-v1';
  function loadSettings(){
    try{ const raw = localStorage.getItem(LS_KEY); if(!raw) return {...DEFAULTS};
      const parsed = JSON.parse(raw);
      return { ...DEFAULTS, ...parsed };
    }catch{ return {...DEFAULTS}; }
  }
  function saveSettings(s){ localStorage.setItem(LS_KEY, JSON.stringify(s)); }
  let settings = loadSettings();

  // ===== ELEMENTS =====
  const leftEl = document.querySelector('#left span');
  const rightEl = document.querySelector('#right span');
  const signEl = document.querySelector('#sign span');
  const leverEl = document.getElementById('lever');
  const pullBtn = document.getElementById('pull');
  const readout = document.getElementById('readout');
  const rangeLabel = document.getElementById('rangeLabel');
  const form = document.getElementById('answerForm');
  const answerInput = document.getElementById('answer');
  const checkBtn = document.getElementById('check');
  const feedback = document.getElementById('feedback');

  const modal = document.getElementById('settingsModal');
  const gearBtn = document.getElementById('gear');
  const minInp = document.getElementById('min');
  const maxInp = document.getElementById('max');
  const baseInp = document.getElementById('base');
  const varInp = document.getElementById('var');
  const durLInp = document.getElementById('durL');
  const durSInp = document.getElementById('durS');
  const durRInp = document.getElementById('durR');
  const tickInp = document.getElementById('tick');
  const nonnegInp = document.getElementById('nonneg');
  const plusInp = document.getElementById('plus');
  const minusInp = document.getElementById('minus');
  const saveBtn = document.getElementById('save');
  const closeBtn = document.getElementById('close');
  const resetBtn = document.getElementById('reset');

  rangeLabel.textContent = `${settings.min}–${settings.max}`;

  let isSpinning = false;
  let currentOutcome = null; // {a,b,sign,result}

  // ===== SOUND =====
  let audioCtx;
  function tick(){
    if(!settings.tick) return;
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
    o.type='square'; o.frequency.value=900; g.gain.value=0.03; o.connect(g); g.connect(audioCtx.destination);
    o.start(); setTimeout(()=>o.stop(), 25);
  }

  // ===== ANIMATION =====
  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

  function spinReel({element, items, duration, targetIndex}){
    return new Promise(resolve=>{
      const n = items.length;
      const startIndex = Math.floor(Math.random()*n);
      const loops = settings.baseRounds + Math.floor(Math.random()*settings.varianceRounds);
      const totalSteps = loops*n + ((targetIndex - startIndex + n) % n);
      let lastStep = -1; let start = null;

      function frame(ts){
        if(!start) start = ts;
        const t = Math.min(1, (ts-start)/duration);
        const eased = easeOutCubic(t);
        const step = Math.floor(eased * totalSteps);
        if(step !== lastStep){
          const index = (startIndex + step) % n;
          element.textContent = items[index];
          tick();
          lastStep = step;
        }
        if(t < 1){ requestAnimationFrame(frame); }
        else { element.textContent = items[targetIndex]; resolve(); }
      }
      requestAnimationFrame(frame);
    });
  }

  function randomInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function getDigits(){
    const count = settings.max - settings.min + 1;
    return Array.from({length: count}, (_,i)=> String(i + settings.min));
  }
  function getSigns(){ return settings.signs.slice(); }

  // UI helpers
  function setAnswerEnabled(enabled){
    answerInput.disabled = !enabled;
    checkBtn.disabled = !enabled;
    if(enabled){ answerInput.focus(); answerInput.select?.(); }
  }
  function clearFeedback(){ feedback.textContent=''; feedback.className=''; }

  async function pull(){
    if(isSpinning) return;
    isSpinning = true;
    pullBtn.disabled = true;
    setAnswerEnabled(false);
    clearFeedback();
    readout.innerHTML = `Reels spinning… guess after they stop!`;

    leverEl.classList.add('is-pulled');
    setTimeout(()=>leverEl.classList.remove('is-pulled'), 220);

    const digits = getDigits();
    let a = randomInt(settings.min, settings.max);
    let b = randomInt(settings.min, settings.max);
    const signs = getSigns();
    // Ensure at least one sign exists
    const sign = signs.length ? signs[Math.floor(Math.random()*signs.length)] : '+';

    if(settings.nonNegative && sign === '−' && b > a){ const t=a; a=b; b=t; }

    const leftTargetIndex  = digits.indexOf(String(a));
    const rightTargetIndex = digits.indexOf(String(b));
    const signTargetIndex  = ['+','−'].indexOf(sign); // items array for sign reel is fixed order

    await Promise.all([
      spinReel({element:leftEl,  items:digits,          duration:settings.durLeft,  targetIndex:leftTargetIndex}),
      spinReel({element:signEl,  items:['+','−'],       duration:settings.durSign,  targetIndex:signTargetIndex}),
      spinReel({element:rightEl, items:digits,          duration:settings.durRight, targetIndex:rightTargetIndex})
    ]);

    const result = sign === '+' ? (a + b) : (a - b);
    currentOutcome = { a, b, sign, result };

    readout.innerHTML = `Type your answer and press <kbd>Enter</kbd> or click <strong>Check</strong>.`;
    answerInput.value = '';
    setAnswerEnabled(true);
    isSpinning = false;
    pullBtn.disabled = false;
  }

  // Submit handler
  form.addEventListener('submit', (e)=>{
    e.preventDefault();
    if(!currentOutcome) return;
    const raw = answerInput.value.trim();
    if(raw === ''){ feedback.innerHTML = `<span class="badge no">Enter a number</span>`; return; }
    const guess = Number(raw);
    if(Number.isNaN(guess)){ feedback.innerHTML = `<span class="badge no">That’s not a number</span>`; return; }

    const {a,b,sign,result} = currentOutcome;
    const correct = (guess === result);
    if(correct){
      feedback.innerHTML = `<span class="badge ok">Correct!</span> &nbsp; <strong>${a} ${sign} ${b} = ${result}</strong>`;
    } else {
      feedback.innerHTML = `<span class="badge no">Not quite</span> &nbsp; <strong>${a} ${sign} ${b} = ${result}</strong> &nbsp; (you entered ${guess})`;
    }
  });

  pullBtn.addEventListener('click', pull);
  window.addEventListener('keydown', (e)=>{ if(e.code === 'Space'){ e.preventDefault(); pull(); } });

  // ===== SETTINGS MODAL LOGIC =====
  function openModal(){
    // Fill inputs from current settings
    minInp.value = settings.min; maxInp.value = settings.max;
    baseInp.value = settings.baseRounds; varInp.value = settings.varianceRounds;
    durLInp.value = settings.durLeft; durSInp.value = settings.durSign; durRInp.value = settings.durRight;
    tickInp.checked = settings.tick; nonnegInp.checked = settings.nonNegative;
    plusInp.checked = settings.signs.includes('+');
    minusInp.checked = settings.signs.includes('−');
    modal.classList.add('open');
  }
  function closeModal(){ modal.classList.remove('open'); }

  function parseIntSafe(v, def){ const n = parseInt(v, 10); return Number.isFinite(n) ? n : def; }

  function handleSave(){
    const next = { ...settings };
    next.min = parseIntSafe(minInp.value, settings.min);
    next.max = parseIntSafe(maxInp.value, settings.max);
    if(next.max < next.min){ // clamp
      const t = next.min; next.min = next.max; next.max = t;
    }
    next.baseRounds = Math.max(0, parseIntSafe(baseInp.value, settings.baseRounds));
    next.varianceRounds = Math.max(0, parseIntSafe(varInp.value, settings.varianceRounds));
    next.durLeft = Math.max(100, parseIntSafe(durLInp.value, settings.durLeft));
    next.durSign = Math.max(100, parseIntSafe(durSInp.value, settings.durSign));
    next.durRight = Math.max(100, parseIntSafe(durRInp.value, settings.durRight));
    next.tick = !!tickInp.checked;
    next.nonNegative = !!nonnegInp.checked;
    const selectedSigns = [];
    if(plusInp.checked) selectedSigns.push('+');
    if(minusInp.checked) selectedSigns.push('−');
    if(selectedSigns.length === 0) selectedSigns.push('+');
    next.signs = selectedSigns;

    settings = next;
    saveSettings(settings);
    rangeLabel.textContent = `${settings.min}–${settings.max}`;
    closeModal();
  }

  gearBtn.addEventListener('click', openModal);
  document.getElementById('save').addEventListener('click', handleSave);
  document.getElementById('close').addEventListener('click', closeModal);
  resetBtn.addEventListener('click', ()=>{ settings = {...DEFAULTS}; saveSettings(settings); handleSave(); });
  modal.addEventListener('click', (e)=>{ if(e.target === modal) closeModal(); });
  window.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });

  // ===== INITIAL PAINT =====
  leftEl.textContent = String(settings.min);
  rightEl.textContent = String(settings.min);
  signEl.textContent = '+';
  function setAnswerEnabled(enabled){
    answerInput.disabled = !enabled;
    checkBtn.disabled = !enabled;
  }
  setAnswerEnabled(false);
  </script>
</body>
</html>
